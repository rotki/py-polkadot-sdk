[build-system]
requires = [
    "setuptools>=80.9.0",
    "setuptools-scm>=8.3.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "substrate-interface"
description = "Library for interfacing with a Substrate node"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Rotki Solutions GmbH", email = "info@rotki.com"},
    {name = "Stichting Polkascan (Polkascan Foundation)", email = "info@polkascan.org"},
]
keywords = ["interface", "polkascan", "polkadot", "substrate", "blockchain", "rpc", "kusama"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
]
dynamic = ["version"]
dependencies = [
    "requests>=2.21.0,<3",
    "scalecodec>=1.2.10,<1.3",
    "websocket-client>=0.57.0,<2",
    "xxhash>=4.0.1,<5",
]

[project.urls]
Homepage = "https://github.com/rotki/py-polkadot-sdk"
Documentation = "https://github.com/rotki/py-polkadot-sdk"
Issues = "https://github.com/rotki/py-polkadot-sdk/issues"
Repository = "https://github.com/rotki/py-polkadot-sdk"

[project.optional-dependencies]
test = [
    "coverage>=7.10.0",
    "pytest>=8.4.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.0",
    "mkdocs-material>=9.6.0",
    "mkdocstrings[python]>=0.30.0",
]
lint = [
    "flake8>=7.3.0",
]
test = [
    "coverage>=7.10.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.setuptools.packages.find]
exclude = ["contrib", "docs", "test", "tests"]
include = ["substrateinterface*"]

[tool.setuptools.package-data]
substrateinterface = ["data/chainspecs/*.json"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
