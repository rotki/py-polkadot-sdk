name: Test and deploy to PYPI

on:
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

env:
  UV_VERSION: '0.11.27'

jobs:
  deploy:
    name: Build and publish release
    environment:
      name: pypi
      url: https://pypi.org/p/substrate-interface
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing via OIDC.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
        with:
          cache-dependency-glob: uv.lock
          enable-cache: false
          version: ${{ env.UV_VERSION }}

      - name: Install locked dependencies
        run: uv sync --locked --group lint --group test

      - name: Lint with flake8
        run: |
          uv run --no-sync flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run --no-sync flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: uv run --no-sync pytest

      - name: Build distributions
        run: uv build --no-sources

      - name: Publish distributions
        run: uv publish --trusted-publishing always dist/*
